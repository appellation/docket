[package]
name = "docket"
version = "0.1.0"
edition = "2024"
description = "Desktop app for managing GitHub pull request workflows"
publish = false

[features]
# Compile Metal shaders at runtime so builds don't require Xcode's Metal
# Toolchain (`xcodebuild -downloadComponent MetalToolchain`). Disable with
# `--no-default-features` for release builds that precompile shaders.
default = ["runtime_shaders"]
runtime_shaders = ["gpui/runtime_shaders"]

[dependencies]
gpui = "0.2.2"

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keys cached analyses by what went into them (`ai/analysis.rs`).
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
dirs = "6"
futures = "0.3"
# Git's ignore rules, for listing a checkout's directories (ripgrep's and fd's).
ignore = "0.4.34"
# File search (`projects/search.rs`): ripgrep's own searcher and regex
# matcher for contents, and Helix's fzf-style matcher for names.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
similar = "3"
tree-sitter = "0.27"
tree-sitter-language = "0.1"

# Grammars for syntax highlighting; register new ones in `syntax/languages.rs`.
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"

# Native window tabs (`ui/windows.rs`). GPUI groups windows into tabs only
# as the user's "Prefer tabs" setting says, so New Tab asks AppKit itself.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWindowTabGroup",
] }
raw-window-handle = "0.6"

[profile.dev]
# GPUI is heavy; optimizing dependencies keeps debug builds usable.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# Headless windows and simulated input for UI tests (`#[gpui::test]`).
gpui = { version = "0.2.2", features = ["test-support"] }
tempfile = "3"
