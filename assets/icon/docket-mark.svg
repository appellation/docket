<!-- Monochrome Docket glyph on a transparent background, for in-app use
     (GPUI's svg() element tints it with the text color) and anywhere a
     single-color logo is needed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="524" height="524" viewBox="250 250 524 524">
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="250" y="250" width="524" height="524">
      <rect x="250" y="250" width="524" height="524" fill="#fff"/>
      <circle cx="674" cy="512" r="118"/>
    </mask>
  </defs>
  <g fill="none" stroke="#000" stroke-width="84" stroke-linecap="round">
    <path d="M314 292V732"/>
    <path d="M454 292A220 220 0 0 1 454 732" mask="url(#gap)"/>
  </g>
  <circle cx="674" cy="512" r="78"/>
</svg>
