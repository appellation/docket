<!-- Docket app icon. A "D" taken apart into a git graph: the stem is the base
     branch, the bowl beside it is a pull request off it, and the dot breaking
     the bowl is the PR pending on you. Monochrome, on a graphite tile.
     Uses the macOS icon grid: 824pt body inset 100pt in a 1024pt canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="774">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d4d6da"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="674" cy="512" r="118"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <g fill="none" stroke="url(#glyph)" stroke-width="84" stroke-linecap="round">
    <path d="M314 292V732"/>
    <path d="M454 292A220 220 0 0 1 454 732" mask="url(#gap)"/>
  </g>
  <circle cx="674" cy="512" r="78" fill="url(#glyph)"/>
</svg>
