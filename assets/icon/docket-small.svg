<!-- Docket app icon simplified for 16-32px: heavier strokes, a larger glyph,
     and wider gaps so the stem, bowl and dot stay apart. Same grid as
     docket.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="694" cy="512" r="150"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g fill="none" stroke="#f2f3f5" stroke-width="116" stroke-linecap="round">
    <path d="M298 276V748"/>
    <path d="M462 276A236 236 0 0 1 462 748" mask="url(#gap)"/>
  </g>
  <circle cx="694" cy="512" r="100" fill="#f2f3f5"/>
</svg>
