# Builds Docket.app for Apple silicon and Intel, and publishes it where
# Docket updates itself from (src/updater.rs):
#
# - Every push to main: the `main-latest` prerelease, for main builds.
# - Every published release (not a prerelease): its stable builds. The
#   release's tag must be Cargo.toml's version, `v<version>`.
#
# `main-latest` is published with the workflow's own token, which doesn't
# start workflows, so it never comes back here as a release.
#
# Builds are signed ad hoc unless these secrets are set. They're read from
# the repository, or, with the repository variable
# DOCKET_RELEASE_ENVIRONMENT naming one, from that environment, which can
# limit them to runs from `main` and `v*` tags so a workflow changed on
# another branch can't read them. Environments in a private repository need
# GitHub Pro. See "Protecting the signing key" in the README.
#
# - DOCKET_SIGNING_CERTIFICATE: a code signing certificate and its private
#   key, exported from Keychain Access as a .p12 and base64-encoded
#   (`base64 -i cert.p12 | pbcopy`). A Developer ID Application, or a
#   self-signed one. Export it with its chain if codesign can't build one.
# - DOCKET_SIGNING_CERTIFICATE_PASSWORD: the .p12's password.
# - DOCKET_NOTARY_KEY, DOCKET_NOTARY_KEY_ID, DOCKET_NOTARY_ISSUER: an App
#   Store Connect API key (the .p8's contents), its ID, and its issuer ID,
#   to notarize builds signed with a Developer ID. Required with one:
#   Docket only updates to Developer ID builds that Gatekeeper accepts.
#
# Once Docket is signed with a certificate, it only updates to builds signed
# with the same one (src/updater.rs). See "Changing certificates" in the
# README.
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
  # A newer push to main supersedes a build of an older one.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CHANNEL: ${{ github.event_name == 'push' && 'main' || 'stable' }}

defaults:
  run:
    # Named, GitHub runs bash with `-eo pipefail`, so a failing build in a
    # pipeline or `$(…)` fails the step.
    shell: bash

jobs:
  build:
    # Prereleases aren't on a channel.
    if: github.event_name == 'push' || !github.event.release.prerelease
    strategy:
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    # Where the signing secrets are: the environment named, else the
    # repository's.
    environment: ${{ vars.DOCKET_RELEASE_ENVIRONMENT }}
    env:
      # Pinned, so a new default image's Xcode doesn't change the build
      # unannounced. Xcode 26's Metal compiler is a separate download, below.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Secrets can't be tested in `if`s.
      HAS_CERTIFICATE: ${{ secrets.DOCKET_SIGNING_CERTIFICATE != '' }}
      HAS_NOTARY_KEY: ${{ secrets.DOCKET_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag is Cargo's version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            sed -n 's/.*"name":"docket","version":"\([^"]*\)".*/\1/p')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::The release is $TAG, but Cargo.toml's version is $version. Tag it v$version."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Run it: without the toolchain, Xcode 26 has a `metal` that only says
      # it's missing.
      - name: Download the Metal Toolchain
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          if ! xcrun -sdk macosx metal --version; then
            echo "::error::$DEVELOPER_DIR has no Metal compiler, even after downloading the Metal Toolchain."
            exit 1
          fi

      # In a keychain of its own, which only codesign may use, deleted after.
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.DOCKET_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DOCKET_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          p12="$RUNNER_TEMP/certificate.p12"
          base64 --decode <<<"$CERTIFICATE" > "$p12"
          security import "$p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # Searched along with the login keychain, for codesign.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"

          found="$(security find-identity -p codesigning "$keychain" | awk '$1 == "1)"' | head -n 1)"
          identity="$(awk '{ print $2 }' <<<"$found")"
          if [[ -z "$identity" ]]; then
            echo "::error::DOCKET_SIGNING_CERTIFICATE has no code signing identity in it."
            exit 1
          fi
          # Docket refuses a Developer ID update that Gatekeeper doesn't
          # accept, and it doesn't accept one that isn't notarized.
          if [[ "$found" == *'"Developer ID Application:'* && "$HAS_NOTARY_KEY" != true ]]; then
            echo "::error::Builds signed with a Developer ID must be notarized; set DOCKET_NOTARY_KEY, DOCKET_NOTARY_KEY_ID, and DOCKET_NOTARY_ISSUER."
            exit 1
          fi
          echo "DOCKET_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notary key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          KEY: ${{ secrets.DOCKET_NOTARY_KEY }}
          KEY_ID: ${{ secrets.DOCKET_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.DOCKET_NOTARY_ISSUER }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$KEY" > "$key"
          {
            echo "DOCKET_NOTARY_KEY=$key"
            echo "DOCKET_NOTARY_KEY_ID=$KEY_ID"
            echo "DOCKET_NOTARY_ISSUER=$ISSUER"
          } >> "$GITHUB_ENV"

      # Without `runtime_shaders` (on by default, so local builds don't need
      # the Metal compiler), GPUI compiles its shaders into the binary
      # rather than at every launch.
      - name: Build Docket.app
        id: package
        run: |
          # The zip and the disk image, the last two lines.
          packaged="$(scripts/package.sh --channel "$CHANNEL" --no-default-features | tail -n 2)"
          {
            echo "zip=$(sed -n 1p <<<"$packaged")"
            echo "dmg=$(sed -n 2p <<<"$packaged")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: docket-${{ matrix.runner }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and notary key
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/notary-key.p8"

  # Once both are built, so `main-latest` is replaced in one go.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the ${{ env.CHANNEL }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh --channel "$CHANNEL" dist/*.zip dist/*.dmg
